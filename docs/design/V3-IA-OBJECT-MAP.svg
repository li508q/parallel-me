<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="1220" viewBox="0 0 1500 1220">
  <defs>
    <filter id="grain">
      <feTurbulence type="fractalNoise" baseFrequency="0.72" numOctaves="2" stitchTiles="stitch"/>
      <feColorMatrix values="0 0 0 0 0.055  0 0 0 0 0.043  0 0 0 0 0.025  0 0 0 0.035 0"/>
    </filter>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M2,2 L10,6 L2,10" fill="none" stroke="#7C7568" stroke-width="1.5"/>
    </marker>
    <style>
      .bg{fill:#F7F0E3}.paper{fill:#FFFCF5;stroke:#D8CBB8;stroke-width:1.4}.sunk{fill:#EDE2D0;stroke:#D8CBB8;stroke-width:1.2}
      .ink{fill:#191713}.body{fill:#3C3932}.mute{fill:#7C7568}.faint{fill:#B7AC9B}
      .line{stroke:#7C7568;stroke-width:1.5;fill:none;marker-end:url(#arrow)}.softLine{stroke:#D8CBB8;stroke-width:1.3;fill:none}
      .title{font-family:"Songti SC","Source Han Serif SC",serif;font-weight:700}.sans{font-family:"PingFang SC",-apple-system,BlinkMacSystemFont,sans-serif}
      .label{font-size:13px;letter-spacing:1.8px}.bodyText{font-size:18px}.h1{font-size:44px}.h2{font-size:28px}.h3{font-size:22px}
      .money{fill:#8A6F3D}.attach{fill:#8C5042}.time{fill:#5E5369}.temp{fill:#76684D}.silent{fill:#899199}.exile{fill:#6F3F35}.seal{fill:#8E3F32}.gold{fill:#A8844D}.trace{fill:#455F70}
    </style>
  </defs>

  <rect width="1500" height="1220" class="bg"/>
  <rect width="1500" height="1220" fill="url(#grain)" opacity=".55"/>

  <text x="72" y="78" class="title ink h1">V3 信息架构 · Object Map</text>
  <text x="72" y="116" class="sans mute bodyText">产品不是一次聊天流，而是「阁 → 议题 → 会议 → 档案 → 阁更新」的对象系统。</text>
  <line x1="72" y1="150" x2="1428" y2="150" class="softLine"/>

  <!-- Core object chain -->
  <g transform="translate(72 198)">
    <text x="0" y="0" class="sans mute label">01 · CORE OBJECT CHAIN</text>
    <g transform="translate(0 32)">
      <rect width="250" height="146" rx="18" class="paper"/>
      <text x="24" y="42" class="sans mute label">ROOT</text>
      <text x="24" y="82" class="title ink h2">阁 Cabinet</text>
      <text x="24" y="116" class="sans body" font-size="16">用户长期拥有的内在组织</text>
    </g>
    <g transform="translate(330 32)">
      <rect width="250" height="146" rx="18" class="paper"/>
      <text x="24" y="42" class="sans mute label">RECURRING</text>
      <text x="24" y="82" class="title ink h2">议题 Issue</text>
      <text x="24" y="116" class="sans body" font-size="16">反复出现的人生问题</text>
    </g>
    <g transform="translate(660 32)">
      <rect width="250" height="146" rx="18" class="paper"/>
      <text x="24" y="42" class="sans mute label">EVENT</text>
      <text x="24" y="82" class="title ink h2">会议 Meeting</text>
      <text x="24" y="116" class="sans body" font-size="16">某一天处理某个议题</text>
    </g>
    <g transform="translate(990 32)">
      <rect width="250" height="146" rx="18" class="paper"/>
      <text x="24" y="42" class="sans mute label">OUTPUT</text>
      <text x="24" y="82" class="title ink h2">档案 Archive</text>
      <text x="24" y="116" class="sans body" font-size="16">可检索、可追溯、可复盘</text>
    </g>
    <path d="M250 105 C278 105 302 105 330 105" class="line"/>
    <path d="M580 105 C608 105 632 105 660 105" class="line"/>
    <path d="M910 105 C938 105 962 105 990 105" class="line"/>
    <path d="M1115 178 C1115 238 94 238 94 178" class="line"/>
    <text x="430" y="260" class="sans mute" font-size="15">档案反哺阁：席位权力、关系、承诺和反复议题被更新。</text>
  </g>

  <!-- Internal structures -->
  <g transform="translate(72 520)">
    <text x="0" y="0" class="sans mute label">02 · INTERNAL STRUCTURE</text>
    <rect x="0" y="32" width="620" height="350" rx="18" class="paper"/>
    <text x="28" y="78" class="title ink h2">阁的内部结构</text>
    <g transform="translate(28 116)">
      <rect width="132" height="62" rx="10" class="sunk"/><text x="22" y="28" class="sans mute" font-size="13">Standing</text><text x="22" y="52" class="sans body" font-size="17">常任席</text>
      <rect x="154" width="132" height="62" rx="10" class="sunk"/><text x="176" y="28" class="sans mute" font-size="13">Temporary</text><text x="176" y="52" class="sans body" font-size="17">临时席</text>
      <rect x="308" width="132" height="62" rx="10" class="sunk"/><text x="330" y="28" class="sans mute" font-size="13">Silent</text><text x="330" y="52" class="sans body" font-size="17">沉默席</text>
      <rect x="462" width="132" height="62" rx="10" class="sunk"/><text x="484" y="28" class="sans mute" font-size="13">Exiled</text><text x="484" y="52" class="sans body" font-size="17">被流放席</text>
    </g>
    <g transform="translate(32 224)">
      <circle cx="14" cy="14" r="12" class="money"/><text x="42" y="20" class="sans body" font-size="16">权力：谁掌权、谁在野、谁等待转正</text>
      <circle cx="14" cy="62" r="12" class="trace"/><text x="42" y="68" class="sans body" font-size="16">关系：冲突、压制、联盟、调停、误解</text>
      <circle cx="14" cy="110" r="12" class="seal"/><text x="42" y="116" class="sans body" font-size="16">承诺：上次签字动作和完成状态</text>
    </g>
  </g>

  <g transform="translate(732 520)">
    <rect x="0" y="32" width="620" height="350" rx="18" class="paper"/>
    <text x="28" y="78" class="title ink h2">会议内部对象</text>
    <g transform="translate(28 116)">
      <rect width="166" height="48" rx="9" fill="#FFFCF5" stroke="#D8CBB8"/><circle cx="20" cy="24" r="6" class="money"/><text x="38" y="30" class="sans body" font-size="14">Turns · 发言</text>
      <rect x="188" width="166" height="48" rx="9" fill="#FFFCF5" stroke="#D8CBB8"/><circle cx="208" cy="24" r="6" class="attach"/><text x="226" y="30" class="sans body" font-size="14">Cross · 质询</text>
      <rect x="376" width="166" height="48" rx="9" fill="#FFFCF5" stroke="#D8CBB8"/><circle cx="396" cy="24" r="6" class="gold"/><text x="414" y="30" class="sans body" font-size="14">Marks · 判定</text>
      <rect y="72" width="166" height="48" rx="9" fill="#FFFCF5" stroke="#D8CBB8"/><circle cx="20" cy="96" r="6" class="time"/><text x="38" y="102" class="sans body" font-size="14">Verdict · 裁决</text>
      <rect x="188" y="72" width="166" height="48" rx="9" fill="#FFFCF5" stroke="#D8CBB8"/><circle cx="208" cy="96" r="6" class="seal"/><text x="226" y="102" class="sans body" font-size="14">Sign · 承诺</text>
      <rect x="376" y="72" width="166" height="48" rx="9" fill="#FFFCF5" stroke="#455F70"/><circle cx="396" cy="96" r="6" class="trace"/><text x="414" y="102" class="sans body" font-size="14">Evidence · 证据</text>
    </g>
    <line x1="28" y1="274" x2="592" y2="274" class="softLine"/>
    <text x="28" y="306" class="sans mute" font-size="15">会议进行时只显示当前阶段；归档后展开摘要、原声、余波和证据链。</text>
  </g>

  <!-- Views -->
  <g transform="translate(72 946)">
    <text x="0" y="0" class="sans mute label">03 · VIEW MAP</text>
    <rect x="0" y="32" width="1280" height="210" rx="18" class="paper"/>
    <g transform="translate(28 74)">
      <rect width="176" height="70" rx="10" class="sunk"/><text x="18" y="28" class="sans mute" font-size="13">Home</text><text x="18" y="54" class="sans body" font-size="15">开会 / 复盘 / 议题</text>
      <rect x="206" width="176" height="70" rx="10" class="sunk"/><text x="224" y="28" class="sans mute" font-size="13">Case</text><text x="224" y="54" class="sans body" font-size="15">立案 / 组阁</text>
      <rect x="412" width="176" height="70" rx="10" class="sunk"/><text x="430" y="28" class="sans mute" font-size="13">Meeting</text><text x="430" y="54" class="sans body" font-size="15">表态 / 点名 / 裁决</text>
      <rect x="618" width="176" height="70" rx="10" class="sunk"/><text x="636" y="28" class="sans mute" font-size="13">Archive</text><text x="636" y="54" class="sans body" font-size="15">摘要 / 原声 / 余波</text>
      <rect x="824" width="176" height="70" rx="10" class="sunk"/><text x="842" y="28" class="sans mute" font-size="13">Cabinet</text><text x="842" y="54" class="sans body" font-size="15">总览 / 席位 / 议题</text>
      <rect x="1030" width="176" height="70" rx="10" class="sunk"/><text x="1048" y="28" class="sans mute" font-size="13">Seat</text><text x="1048" y="54" class="sans body" font-size="15">保护 / 证据 / 关系</text>
    </g>
    <text x="28" y="178" class="sans mute" font-size="15">设计目标：会议时低复杂度，会议后高可追溯；用户管理的是阁，不是聊天记录。</text>
  </g>
</svg>
