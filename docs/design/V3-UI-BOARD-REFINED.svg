<svg xmlns="http://www.w3.org/2000/svg" width="1900" height="1360" viewBox="0 0 1900 1360">
  <defs>
    <filter id="grain">
      <feTurbulence type="fractalNoise" baseFrequency="0.72" numOctaves="2" stitchTiles="stitch"/>
      <feColorMatrix values="0 0 0 0 0.06  0 0 0 0 0.045  0 0 0 0 0.025  0 0 0 0.04 0"/>
    </filter>
    <style>
      .bg { fill: #F7F0E3; }
      .paper { fill: #FFFCF5; stroke: #D8CBB8; stroke-width: 1.4; }
      .sunk { fill: #EDE2D0; stroke: #D8CBB8; stroke-width: 1.4; }
      .ink { fill: #191713; }
      .body { fill: #3C3932; }
      .mute { fill: #7C7568; }
      .faint { fill: #B7AC9B; }
      .rule { stroke: #D8CBB8; stroke-width: 1.4; }
      .thin { stroke: #D8CBB8; stroke-width: 1; }
      .title { font-family: "Songti SC", "Source Han Serif SC", serif; font-weight: 700; }
      .serif { font-family: "Songti SC", "Source Han Serif SC", serif; }
      .sans { font-family: "PingFang SC", -apple-system, BlinkMacSystemFont, sans-serif; }
      .display { font-size: 58px; }
      .h1 { font-size: 38px; }
      .h2 { font-size: 26px; }
      .bodyText { font-size: 19px; }
      .label { font-size: 13px; letter-spacing: 1.8px; }
      .rest { fill: #556F7A; }
      .money { fill: #8A6F3D; }
      .free { fill: #3F6B5A; }
      .attach { fill: #8C5042; }
      .time { fill: #5E5369; }
      .temp { fill: #76684D; }
      .silent { fill: #899199; }
      .exile { fill: #6F3F35; }
      .seal { fill: #8E3F32; }
      .gold { fill: #A8844D; }
      .blueTrace { fill: #455F70; }
      .dash { stroke-dasharray: 5 5; }
    </style>
  </defs>

  <rect width="1900" height="1360" class="bg"/>
  <rect width="1900" height="1360" fill="url(#grain)" opacity="0.55"/>

  <text x="80" y="80" class="title ink display">ParallelMe V3 · Refined</text>
  <text x="80" y="118" class="sans mute bodyText">墨色定秩序，矿物色定席位 · 会议时是仪式，会议后是档案</text>
  <line x1="80" y1="154" x2="1820" y2="154" class="rule"/>

  <!-- Palette -->
  <g transform="translate(80 198)">
    <text x="0" y="0" class="title ink h2">01 · 色彩系统</text>
    <rect x="0" y="28" width="520" height="368" rx="18" class="paper"/>
    <text x="32" y="76" class="sans mute label">PAPER / INK / LINE · 88%</text>
    <g transform="translate(32 105)">
      <rect x="0" y="0" width="76" height="76" rx="10" fill="#F7F0E3" stroke="#D8CBB8"/>
      <rect x="90" y="0" width="76" height="76" rx="10" fill="#FFFCF5" stroke="#D8CBB8"/>
      <rect x="180" y="0" width="76" height="76" rx="10" fill="#EDE2D0" stroke="#D8CBB8"/>
      <rect x="270" y="0" width="76" height="76" rx="10" fill="#191713"/>
      <rect x="360" y="0" width="76" height="76" rx="10" fill="#7C7568"/>
      <text x="0" y="104" class="sans mute" font-size="14">paper.base</text>
      <text x="90" y="104" class="sans mute" font-size="14">paper.lift</text>
      <text x="180" y="104" class="sans mute" font-size="14">paper.sunk</text>
      <text x="270" y="104" class="sans mute" font-size="14">ink.core</text>
      <text x="360" y="104" class="sans mute" font-size="14">ink.mute</text>
    </g>
    <text x="32" y="252" class="sans mute label">MINERAL SEATS · 8%</text>
    <g transform="translate(32 278)">
      <circle cx="12" cy="12" r="12" class="rest"/>
      <circle cx="64" cy="12" r="12" class="money"/>
      <circle cx="116" cy="12" r="12" class="free"/>
      <circle cx="168" cy="12" r="12" class="attach"/>
      <circle cx="220" cy="12" r="12" class="time"/>
      <circle cx="272" cy="12" r="12" class="temp"/>
      <circle cx="324" cy="12" r="12" class="silent"/>
      <circle cx="376" cy="12" r="12" class="exile"/>
      <text x="0" y="52" class="sans mute" font-size="14">低饱和，只作点、线、边框，不作正文色。</text>
    </g>
  </g>

  <!-- Home -->
  <g transform="translate(650 198)">
    <text x="0" y="0" class="title ink h2">02 · 首页不是空白聊天框</text>
    <rect x="0" y="28" width="560" height="368" rx="18" class="paper"/>
    <text x="34" y="78" class="sans mute label">今日开会</text>
    <text x="34" y="132" class="title ink h1">今天要开什么会？</text>
    <rect x="34" y="158" width="492" height="90" rx="12" fill="#F7F0E3" stroke="#D8CBB8"/>
    <text x="58" y="207" class="serif mute bodyText">写下那个没人能替你决定的议题。</text>
    <rect x="392" y="268" width="134" height="40" rx="20" fill="#191713"/>
    <text x="443" y="294" class="sans" font-size="15" fill="#FFFCF5">立案</text>
    <line x1="34" y1="326" x2="526" y2="326" class="thin"/>
    <text x="34" y="354" class="sans mute" font-size="15">待复盘：3 天前你签过「给妈妈发 30 秒语音」。做了吗？</text>
  </g>

  <!-- Issue Hub -->
  <g transform="translate(1260 198)">
    <text x="0" y="0" class="title ink h2">03 · 反复议题入口</text>
    <rect x="0" y="28" width="560" height="368" rx="18" class="paper"/>
    <text x="34" y="78" class="sans mute label">正在反复出现</text>
    <g transform="translate(34 104)">
      <rect x="0" y="0" width="492" height="62" rx="10" fill="#FFFCF5" stroke="#D8CBB8"/>
      <circle cx="24" cy="31" r="7" class="attach"/>
      <text x="44" y="37" class="sans body" font-size="17">妈妈期待与自由 · 4 次会议</text>
      <rect x="0" y="78" width="492" height="62" rx="10" fill="#FFFCF5" stroke="#D8CBB8"/>
      <circle cx="24" cy="109" r="7" class="money"/>
      <text x="44" y="115" class="sans body" font-size="17">工作身份与身体疲惫 · 3 次会议</text>
      <rect x="0" y="156" width="492" height="62" rx="10" fill="#FFFCF5" stroke="#D8CBB8"/>
      <circle cx="24" cy="187" r="7" class="free"/>
      <text x="44" y="193" class="sans body" font-size="17">亲密关系里的退缩 · 2 次会议</text>
    </g>
    <text x="34" y="348" class="sans mute" font-size="15">首页应同时有新议题、待复盘、反复议题。</text>
  </g>

  <!-- Assembly -->
  <g transform="translate(80 680)">
    <text x="0" y="0" class="title ink h2">04 · 立案 / 组阁仍保持仪式</text>
    <rect x="0" y="28" width="560" height="450" rx="18" class="paper"/>
    <text x="34" y="78" class="sans mute label">本次议题</text>
    <rect x="34" y="104" width="492" height="92" rx="12" class="sunk"/>
    <text x="60" y="143" class="title ink" font-size="24">我要不要牺牲收入和城市自由，</text>
    <text x="60" y="174" class="title ink" font-size="24">换取妈妈眼里的稳定？</text>
    <text x="34" y="240" class="sans mute label">本次组阁</text>
    <g transform="translate(34 266)">
      <rect x="0" y="0" width="152" height="64" rx="9" fill="#FFFCF5" stroke="#8A6F3D"/>
      <circle cx="20" cy="32" r="6" class="money"/>
      <text x="38" y="37" class="sans body" font-size="16">资源席 · 常任</text>
      <rect x="170" y="0" width="152" height="64" rx="9" fill="#FFFCF5" stroke="#8C5042"/>
      <circle cx="190" cy="32" r="6" class="attach"/>
      <text x="208" y="37" class="sans body" font-size="16">依恋席 · 常任</text>
      <rect x="340" y="0" width="152" height="64" rx="9" fill="#FFFCF5" stroke="#76684D" stroke-dasharray="5 5"/>
      <circle cx="360" cy="32" r="6" class="temp"/>
      <text x="378" y="37" class="sans body" font-size="16">怕选错 · 临时</text>
      <rect x="0" y="84" width="152" height="64" rx="9" fill="#FFFCF5" stroke="#5E5369"/>
      <circle cx="20" cy="116" r="6" class="time"/>
      <text x="38" y="121" class="sans body" font-size="16">远望席 · 常任</text>
      <rect x="170" y="84" width="152" height="64" rx="9" fill="#FFFCF5" stroke="#76684D" stroke-dasharray="5 5"/>
      <circle cx="190" cy="116" r="6" class="temp"/>
      <text x="208" y="121" class="sans body" font-size="16">想证明 · 临时</text>
    </g>
    <rect x="374" y="400" width="152" height="42" rx="21" fill="#191713"/>
    <text x="419" y="427" class="sans" font-size="15" fill="#FFFCF5">确认组阁</text>
  </g>

  <!-- Archive detail -->
  <g transform="translate(690 680)">
    <text x="0" y="0" class="title ink h2">05 · 档案必须可追溯</text>
    <rect x="0" y="28" width="560" height="450" rx="18" class="paper"/>
    <text x="34" y="74" class="sans mute label">会议档案 · 2026/05/04</text>
    <text x="34" y="116" class="title ink" font-size="30">妈妈期待与城市自由</text>
    <line x1="34" y1="142" x2="526" y2="142" class="thin"/>
    <g transform="translate(34 170)">
      <rect x="0" y="0" width="126" height="38" rx="19" fill="#191713"/>
      <text x="48" y="25" class="sans" font-size="14" fill="#FFFCF5">摘要</text>
      <rect x="140" y="0" width="126" height="38" rx="19" fill="#F7F0E3" stroke="#D8CBB8"/>
      <text x="188" y="25" class="sans mute" font-size="14">原声</text>
      <rect x="280" y="0" width="126" height="38" rx="19" fill="#F7F0E3" stroke="#D8CBB8"/>
      <text x="328" y="25" class="sans mute" font-size="14">余波</text>
    </g>
    <text x="34" y="250" class="sans body" font-size="17">裁决：先不考公，今晚给妈妈发 30 秒语音。</text>
    <text x="34" y="286" class="sans body" font-size="17">最尖锐质询：让她安心的代价是谁在付？</text>
    <g transform="translate(34 322)">
      <rect x="0" y="0" width="492" height="78" rx="10" fill="#F7F0E3" stroke="#D8CBB8"/>
      <circle cx="24" cy="39" r="7" class="blueTrace"/>
      <text x="44" y="34" class="sans body" font-size="15">证据链：点击可回到原声、用户判定、质询问答。</text>
      <text x="44" y="58" class="sans mute" font-size="14">所有侧记和席位变化都必须有出处。</text>
    </g>
  </g>

  <!-- Cabinet -->
  <g transform="translate(1300 680)">
    <text x="0" y="0" class="title ink h2">06 · 我的阁是对象系统</text>
    <rect x="0" y="28" width="520" height="450" rx="18" class="paper"/>
    <text x="34" y="78" class="sans mute label">我的阁</text>
    <text x="34" y="120" class="title ink" font-size="30">席位、议题、档案互相反哺</text>
    <g transform="translate(34 154)">
      <rect x="0" y="0" width="452" height="52" rx="9" fill="#FFFCF5" stroke="#D8CBB8"/>
      <circle cx="24" cy="26" r="7" class="money"/>
      <text x="44" y="32" class="sans body" font-size="16">本周掌权：资源席 · 3 次</text>
      <rect x="0" y="68" width="452" height="52" rx="9" fill="#FFFCF5" stroke="#D8CBB8"/>
      <circle cx="24" cy="94" r="7" class="silent"/>
      <text x="44" y="100" class="sans body" font-size="16">最近沉默：自由席 · 只出现 1 次</text>
      <rect x="0" y="136" width="452" height="52" rx="9" fill="#FFFCF5" stroke="#D8CBB8"/>
      <circle cx="24" cy="162" r="7" class="gold"/>
      <text x="44" y="168" class="sans body" font-size="16">等待转正：怕选错的我 · 4 次</text>
    </g>
    <g transform="translate(54 382)">
      <line x1="0" y1="0" x2="380" y2="0" stroke="#D8CBB8" stroke-width="1.4"/>
      <circle cx="0" cy="0" r="8" class="attach"/>
      <circle cx="190" cy="0" r="8" class="temp"/>
      <circle cx="380" cy="0" r="8" class="time"/>
      <text x="90" y="32" class="sans mute" font-size="14">关系图只在“我的阁”展开，不塞进会议过程。</text>
    </g>
  </g>

  <text x="80" y="1300" class="sans mute bodyText">Refined judgment: 会议进行时降低复杂度；会议结束后通过摘要 / 原声 / 余波与证据链建立长期记忆。</text>
</svg>
