<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1020" viewBox="0 0 1440 1020" role="img" aria-labelledby="title desc">
  <title id="title">ParallelMe v0.6 Interaction Wireflow</title>
  <desc id="desc">Four-stage flow for a five-voice conversation with API setup and user intervention points.</desc>
  <defs>
    <style>
      .sans { font-family: Geist, "PingFang SC", "Noto Sans SC", sans-serif; }
      .serif { font-family: "Source Han Serif SC", "Noto Serif SC", "Songti SC", serif; }
      .mono { font-family: "Geist Mono", "SF Mono", monospace; }
      .title { fill: #191713; font-size: 46px; font-weight: 650; }
      .h2 { fill: #191713; font-size: 24px; font-weight: 620; }
      .body { fill: #3C3932; font-size: 18px; }
      .muted { fill: #7C7568; font-size: 15px; }
      .tiny { fill: #B7AC9B; font-size: 13px; letter-spacing: 0.12em; }
      .card { fill: #FBF9F4; stroke: #D8CBB8; stroke-width: 1.5; }
      .pill { fill: #F4F1EC; stroke: #D8CBB8; stroke-width: 1.5; }
      .line { stroke: #D8CBB8; stroke-width: 2; fill: none; }
      .arrow { stroke: #7C7568; stroke-width: 2; fill: none; marker-end: url(#arrow); }
    </style>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#7C7568"/>
    </marker>
  </defs>

  <rect width="1440" height="1020" fill="#F4F1EC"/>
  <text x="80" y="86" class="tiny sans">PARALLELME · INTERACTION WIREFLOW · V0.6</text>
  <text x="80" y="145" class="title serif">从一句困惑，到一句清明。</text>
  <text x="80" y="186" class="body sans">主路径是点击和确认，文本意图只做辅助。用户始终是主持者。</text>

  <g transform="translate(80 250)">
    <rect class="card" width="260" height="470" rx="8"/>
    <circle cx="36" cy="36" r="10" fill="#455F70"/>
    <text x="60" y="44" class="h2 sans">困惑成形</text>
    <text x="28" y="88" class="body serif">陈情</text>
    <rect x="28" y="110" width="204" height="76" rx="6" fill="#F4F1EC" stroke="#D8CBB8"/>
    <text x="46" y="154" class="muted sans">写下原始困惑</text>
    <text x="28" y="225" class="body serif">轻量追问</text>
    <rect x="28" y="247" width="204" height="76" rx="6" fill="#F4F1EC" stroke="#D8CBB8"/>
    <text x="46" y="278" class="muted sans">事实 · 关系</text>
    <text x="46" y="304" class="muted sans">恐惧 · 最响声音</text>
    <text x="28" y="362" class="body serif">工作焦点</text>
    <rect x="28" y="384" width="204" height="56" rx="6" fill="#EDE2D0" stroke="#D8CBB8"/>
    <text x="46" y="419" class="muted sans">用户确认或改写</text>
  </g>

  <path class="arrow" d="M 360 485 C 395 485, 410 485, 445 485"/>

  <g transform="translate(460 250)">
    <rect class="card" width="260" height="470" rx="8"/>
    <circle cx="36" cy="36" r="10" fill="#536E5A"/>
    <text x="60" y="44" class="h2 sans">五声入席</text>
    <text x="28" y="90" class="muted sans">固定五声，不新增角色。</text>
    <g transform="translate(28 128)">
      <rect class="pill" width="204" height="46" rx="23"/>
      <circle cx="26" cy="23" r="7" fill="#556F7A"/>
      <text x="48" y="29" class="body sans">躺平的我</text>
    </g>
    <g transform="translate(28 184)">
      <rect class="pill" width="204" height="46" rx="23"/>
      <circle cx="26" cy="23" r="7" fill="#8A6F3D"/>
      <text x="48" y="29" class="body sans">搞钱的我</text>
    </g>
    <g transform="translate(28 240)">
      <rect class="pill" width="204" height="46" rx="23"/>
      <circle cx="26" cy="23" r="7" fill="#3F6B5A"/>
      <text x="48" y="29" class="body sans">出走的我</text>
    </g>
    <g transform="translate(28 296)">
      <rect class="pill" width="204" height="46" rx="23"/>
      <circle cx="26" cy="23" r="7" fill="#8C5042"/>
      <text x="48" y="29" class="body sans">怕妈担心的我</text>
    </g>
    <g transform="translate(28 352)">
      <rect class="pill" width="204" height="46" rx="23"/>
      <circle cx="26" cy="23" r="7" fill="#5E5369"/>
      <text x="48" y="29" class="body sans">5 年后的我</text>
    </g>
    <text x="28" y="438" class="muted sans">每声展示：激活理由 / 保护 / 恐惧</text>
  </g>

  <path class="arrow" d="M 740 485 C 775 485, 790 485, 825 485"/>

  <g transform="translate(840 250)">
    <rect class="card" width="260" height="470" rx="8"/>
    <circle cx="36" cy="36" r="10" fill="#A8844D"/>
    <text x="60" y="44" class="h2 sans">五声对话</text>
    <text x="28" y="90" class="muted sans">表达之后，用户必须介入。</text>
    <rect x="28" y="122" width="204" height="70" rx="6" fill="#F4F1EC" stroke="#D8CBB8"/>
    <text x="46" y="153" class="body sans">五声表态</text>
    <text x="46" y="177" class="muted sans">保护 / 恐惧 / 别忽略</text>
    <rect x="28" y="218" width="204" height="70" rx="6" fill="#F4F1EC" stroke="#D8CBB8"/>
    <text x="46" y="249" class="body sans">点名追问</text>
    <text x="46" y="273" class="muted sans">点击某一声后提问</text>
    <rect x="28" y="314" width="204" height="70" rx="6" fill="#F4F1EC" stroke="#D8CBB8"/>
    <text x="46" y="345" class="body sans">换位回答</text>
    <text x="46" y="369" class="muted sans">坐到它的位置说准</text>
    <rect x="28" y="410" width="204" height="34" rx="17" fill="#EDE2D0"/>
    <text x="46" y="433" class="muted sans">互问：代价与盲点</text>
  </g>

  <path class="arrow" d="M 1120 485 C 1155 485, 1170 485, 1205 485"/>

  <g transform="translate(1220 250)">
    <rect class="card" width="140" height="470" rx="8"/>
    <circle cx="34" cy="36" r="10" fill="#8E3F32"/>
    <text x="56" y="44" class="h2 sans">清明</text>
    <text x="28" y="92" class="body serif">清明句</text>
    <line x1="28" y1="116" x2="112" y2="116" class="line"/>
    <text x="28" y="158" class="body serif">NowMe</text>
    <line x1="28" y1="182" x2="112" y2="182" class="line"/>
    <text x="28" y="224" class="body serif">24h</text>
    <text x="28" y="250" class="body serif">承诺</text>
    <line x1="28" y1="280" x2="112" y2="280" class="line"/>
    <text x="28" y="324" class="body serif">记忆</text>
    <text x="28" y="350" class="body serif">同意</text>
  </g>

  <g transform="translate(80 800)">
    <rect class="card" width="1280" height="120" rx="8"/>
    <text x="34" y="46" class="h2 sans">显性介入点</text>
    <text x="34" y="82" class="body sans">暂停 · 追问 · 换位回答 · 这句不准 · 改写工作焦点 · 改写清明句</text>
    <text x="820" y="46" class="h2 sans">真实模型入口</text>
    <text x="820" y="82" class="body sans">未配置 API 时，首页与会谈页都先进入 Setup。</text>
  </g>
</svg>
