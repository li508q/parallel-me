<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="960" viewBox="0 0 1440 960" role="img" aria-labelledby="title desc">
  <title id="title">ParallelMe v0.6 Color System</title>
  <desc id="desc">Paper, ink, voice, and state color tokens for the five-voice conversation interface.</desc>
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="16" flood-color="#191713" flood-opacity="0.08"/>
    </filter>
    <style>
      .sans { font-family: Geist, "PingFang SC", "Noto Sans SC", sans-serif; }
      .serif { font-family: "Source Han Serif SC", "Noto Serif SC", "Songti SC", serif; }
      .mono { font-family: "Geist Mono", "SF Mono", monospace; }
      .label { fill: #7C7568; font-size: 18px; }
      .small { fill: #7C7568; font-size: 15px; }
      .tiny { fill: #B7AC9B; font-size: 13px; letter-spacing: 0.12em; }
      .title { fill: #191713; font-size: 46px; font-weight: 650; }
      .section { fill: #191713; font-size: 24px; font-weight: 620; }
      .card { fill: #FBF9F4; stroke: #D8CBB8; stroke-width: 1.5; }
      .line { stroke: #D8CBB8; stroke-width: 1.5; }
    </style>
  </defs>

  <rect width="1440" height="960" fill="#F4F1EC"/>
  <circle cx="1190" cy="190" r="78" fill="#EDE2D0" opacity="0.45"/>
  <circle cx="1240" cy="245" r="36" fill="#D8CBB8" opacity="0.28"/>

  <text x="80" y="92" class="tiny sans">PARALLELME · DESIGN TOKENS · V0.6</text>
  <text x="80" y="150" class="title serif">纸墨建立秩序，五声只做识别。</text>
  <text x="80" y="190" class="label sans">色彩比例：纸墨 78% · 纸面层 14% · 五声识别色 5% · 状态色 3%</text>

  <g transform="translate(80 250)">
    <rect class="card" width="600" height="285" rx="8" filter="url(#shadow)"/>
    <text x="34" y="48" class="section sans">Paper / Ink</text>
    <text x="34" y="78" class="small sans">页面本体、纸面层级、墨色文字。</text>

    <g transform="translate(34 112)">
      <rect width="118" height="78" rx="6" fill="#F4F1EC" stroke="#D8CBB8"/>
      <text x="0" y="108" class="mono small">paper.base</text>
      <text x="0" y="131" class="mono tiny">#F4F1EC</text>
    </g>
    <g transform="translate(176 112)">
      <rect width="118" height="78" rx="6" fill="#FBF9F4" stroke="#D8CBB8"/>
      <text x="0" y="108" class="mono small">paper.lift</text>
      <text x="0" y="131" class="mono tiny">#FBF9F4</text>
    </g>
    <g transform="translate(318 112)">
      <rect width="118" height="78" rx="6" fill="#EDE2D0" stroke="#D8CBB8"/>
      <text x="0" y="108" class="mono small">paper.sunk</text>
      <text x="0" y="131" class="mono tiny">#EDE2D0</text>
    </g>
    <g transform="translate(460 112)">
      <rect width="118" height="78" rx="6" fill="#191713"/>
      <text x="0" y="108" class="mono small">ink.core</text>
      <text x="0" y="131" class="mono tiny">#191713</text>
    </g>
  </g>

  <g transform="translate(720 250)">
    <rect class="card" width="640" height="285" rx="8" filter="url(#shadow)"/>
    <text x="34" y="48" class="section sans">Voice Colors</text>
    <text x="34" y="78" class="small sans">只用于身份点、左边框、关系线、小标签，不写正文。</text>

    <g transform="translate(34 118)">
      <circle cx="28" cy="28" r="28" fill="#556F7A"/>
      <text x="74" y="24" class="serif section">躺平的我</text>
      <text x="74" y="53" class="mono tiny">seat.rest · #556F7A</text>
    </g>
    <g transform="translate(335 118)">
      <circle cx="28" cy="28" r="28" fill="#8A6F3D"/>
      <text x="74" y="24" class="serif section">搞钱的我</text>
      <text x="74" y="53" class="mono tiny">seat.money · #8A6F3D</text>
    </g>
    <g transform="translate(34 198)">
      <circle cx="28" cy="28" r="28" fill="#3F6B5A"/>
      <text x="74" y="24" class="serif section">出走的我</text>
      <text x="74" y="53" class="mono tiny">seat.roam · #3F6B5A</text>
    </g>
    <g transform="translate(335 198)">
      <circle cx="28" cy="28" r="28" fill="#8C5042"/>
      <text x="74" y="24" class="serif section">怕妈担心的我</text>
      <text x="74" y="53" class="mono tiny">seat.filial · #8C5042</text>
    </g>
  </g>

  <g transform="translate(80 575)">
    <rect class="card" width="600" height="255" rx="8" filter="url(#shadow)"/>
    <text x="34" y="48" class="section sans">State Colors</text>
    <text x="34" y="78" class="small sans">只在状态、承诺、证据链处小面积出现。</text>

    <g transform="translate(34 116)">
      <rect width="112" height="64" rx="6" fill="#8E3F32"/>
      <text x="138" y="23" class="serif section">承诺与重要确认</text>
      <text x="138" y="52" class="mono tiny">seal.action · #8E3F32</text>
    </g>
    <g transform="translate(34 190)">
      <rect width="112" height="36" rx="6" fill="#A8844D"/>
      <text x="138" y="24" class="small sans">最响声音、重点提示 · attention.copper</text>
    </g>
  </g>

  <g transform="translate(720 575)">
    <rect class="card" width="640" height="255" rx="8" filter="url(#shadow)"/>
    <text x="34" y="48" class="section sans">Applied Ratio</text>
    <text x="34" y="78" class="small sans">界面应像档案纸，不像彩色角色卡。</text>
    <rect x="34" y="126" width="440" height="42" rx="6" fill="#F4F1EC" stroke="#D8CBB8"/>
    <rect x="34" y="126" width="343" height="42" rx="6" fill="#F4F1EC"/>
    <rect x="377" y="126" width="62" height="42" fill="#FBF9F4"/>
    <rect x="439" y="126" width="22" height="42" fill="#556F7A"/>
    <rect x="461" y="126" width="13" height="42" rx="6" fill="#8E3F32"/>
    <text x="500" y="154" class="mono small">78 / 14 / 5 / 3</text>
    <line x1="34" y1="205" x2="606" y2="205" class="line"/>
    <text x="34" y="228" class="small sans">主 CTA 用墨色；声音色不承担“可点击”的唯一提示。</text>
  </g>
</svg>
