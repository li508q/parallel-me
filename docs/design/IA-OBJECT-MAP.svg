<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1040" viewBox="0 0 1440 1040" role="img" aria-labelledby="title desc">
  <title id="title">ParallelMe v0.6 IA Object Map</title>
  <desc id="desc">Information architecture and object map for API setup, five-voice meetings, local records, and long-term voice evolution.</desc>
  <defs>
    <style>
      .sans { font-family: Geist, "PingFang SC", "Noto Sans SC", sans-serif; }
      .serif { font-family: "Source Han Serif SC", "Noto Serif SC", "Songti SC", serif; }
      .mono { font-family: "Geist Mono", "SF Mono", monospace; }
      .title { fill: #191713; font-size: 46px; font-weight: 650; }
      .h2 { fill: #191713; font-size: 24px; font-weight: 620; }
      .body { fill: #3C3932; font-size: 17px; }
      .muted { fill: #7C7568; font-size: 15px; }
      .tiny { fill: #B7AC9B; font-size: 13px; letter-spacing: 0.12em; }
      .card { fill: #FBF9F4; stroke: #D8CBB8; stroke-width: 1.5; }
      .data { fill: #F4F1EC; stroke: #D8CBB8; stroke-width: 1.5; }
      .line { stroke: #D8CBB8; stroke-width: 2; fill: none; }
      .arrow { stroke: #7C7568; stroke-width: 2; fill: none; marker-end: url(#arrow); }
    </style>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#7C7568"/>
    </marker>
  </defs>

  <rect width="1440" height="1040" fill="#F4F1EC"/>
  <text x="80" y="86" class="tiny sans">PARALLELME · IA OBJECT MAP · V0.6</text>
  <text x="80" y="145" class="title serif">长期空间是“我的声音”，不是一次性的页面。</text>
  <text x="80" y="186" class="body sans">两条骨架：用户能介入流程，固定五声能长期演化。</text>

  <g transform="translate(80 250)">
    <rect class="card" width="270" height="220" rx="8"/>
    <text x="30" y="48" class="h2 sans">首页</text>
    <text x="30" y="84" class="body sans">今天，想听见哪件事？</text>
    <line x1="30" y1="112" x2="240" y2="112" class="line"/>
    <text x="30" y="148" class="muted sans">陈情输入</text>
    <text x="30" y="178" class="muted sans">API 状态提示</text>
  </g>

  <g transform="translate(80 560)">
    <rect class="card" width="270" height="250" rx="8"/>
    <text x="30" y="48" class="h2 sans">Setup</text>
    <text x="30" y="84" class="body sans">真实模型配置</text>
    <line x1="30" y1="112" x2="240" y2="112" class="line"/>
    <text x="30" y="148" class="muted sans">DeepSeek · 百炼 · Kimi</text>
    <text x="30" y="178" class="muted sans">MiniMax · 豆包 · 自定义</text>
    <text x="30" y="208" class="muted sans">测试通过后保存钥匙</text>
  </g>

  <path class="arrow" d="M 360 360 C 405 360, 425 360, 470 360"/>
  <path class="arrow" d="M 215 520 C 215 500, 215 500, 215 480"/>

  <g transform="translate(490 220)">
    <rect class="card" width="410" height="520" rx="8"/>
    <text x="34" y="50" class="h2 sans">五声会谈</text>
    <text x="34" y="84" class="body sans">四阶段主体验</text>

    <g transform="translate(34 126)">
      <rect class="data" width="342" height="56" rx="6"/>
      <text x="22" y="36" class="body sans">petition · 用户陈情</text>
    </g>
    <g transform="translate(34 196)">
      <rect class="data" width="342" height="56" rx="6"/>
      <text x="22" y="36" class="body sans">clarifyingAnswers · 追问回答</text>
    </g>
    <g transform="translate(34 266)">
      <rect class="data" width="342" height="56" rx="6"/>
      <text x="22" y="36" class="body sans">workingFocus · 工作焦点</text>
    </g>
    <g transform="translate(34 336)">
      <rect class="data" width="342" height="56" rx="6"/>
      <text x="22" y="36" class="body sans">voiceTurns · 五声表达</text>
    </g>
    <g transform="translate(34 406)">
      <rect class="data" width="342" height="56" rx="6"/>
      <text x="22" y="36" class="body sans">followups / roleReversalTurns</text>
    </g>
  </g>

  <path class="arrow" d="M 920 480 C 965 480, 985 480, 1030 480"/>

  <g transform="translate(1050 220)">
    <rect class="card" width="310" height="250" rx="8"/>
    <text x="30" y="48" class="h2 sans">纸页</text>
    <text x="30" y="84" class="body sans">本地 IndexedDB</text>
    <line x1="30" y1="112" x2="280" y2="112" class="line"/>
    <text x="30" y="148" class="muted sans">claritySentence 做标题</text>
    <text x="30" y="178" class="muted sans">NowMe 与 24h 承诺</text>
    <text x="30" y="208" class="muted sans">记忆同意后写入</text>
  </g>

  <g transform="translate(1050 560)">
    <rect class="card" width="310" height="250" rx="8"/>
    <text x="30" y="48" class="h2 sans">我的声音</text>
    <text x="30" y="84" class="body sans">固定五声长期演化</text>
    <line x1="30" y1="112" x2="280" y2="112" class="line"/>
    <text x="30" y="148" class="muted sans">出现次数 / 最响次数</text>
    <text x="30" y="178" class="muted sans">被追问 / 被换位</text>
    <text x="30" y="208" class="muted sans">关键表达 / 承诺复盘</text>
  </g>

  <path class="arrow" d="M 1205 505 C 1205 525, 1205 525, 1205 550"/>

  <g transform="translate(490 805)">
    <rect class="card" width="870" height="130" rx="8"/>
    <text x="34" y="48" class="h2 sans">本地边界</text>
    <text x="34" y="84" class="body sans">API Key 保存于 localStorage / sessionStorage。纸页保存于 ParallelMeV4。服务端不持久化钥匙或会谈内容。</text>
  </g>

  <g transform="translate(490 775)">
    <path class="arrow" d="M 0 0 C -100 0, -140 -30, -140 -95"/>
    <path class="arrow" d="M 690 0 C 690 -35, 690 -35, 690 -55"/>
  </g>
</svg>
