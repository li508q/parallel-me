<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1040" viewBox="0 0 1440 1040" role="img" aria-labelledby="title desc">
  <title id="title">ParallelMe v0.6 Refined UI Board</title>
  <desc id="desc">Refined target interface showing API setup, voice selection, intervention actions, and clarity settlement.</desc>
  <defs>
    <style>
      .sans { font-family: Geist, "PingFang SC", "Noto Sans SC", sans-serif; }
      .serif { font-family: "Source Han Serif SC", "Noto Serif SC", "Songti SC", serif; }
      .mono { font-family: "Geist Mono", "SF Mono", monospace; }
      .title { fill: #191713; font-size: 42px; font-weight: 650; }
      .h2 { fill: #191713; font-size: 22px; font-weight: 620; }
      .body { fill: #3C3932; font-size: 17px; }
      .muted { fill: #7C7568; font-size: 15px; }
      .tiny { fill: #B7AC9B; font-size: 12px; letter-spacing: 0.12em; }
      .screen { fill: #F4F1EC; stroke: #D8CBB8; stroke-width: 2; }
      .card { fill: #FBF9F4; stroke: #D8CBB8; stroke-width: 1.5; }
      .deep { fill: #1A1816; }
      .line { stroke: #D8CBB8; stroke-width: 1.5; fill: none; }
    </style>
  </defs>

  <rect width="1440" height="1040" fill="#F4F1EC"/>
  <text x="80" y="78" class="tiny sans">PARALLELME · REFINED UI BOARD · V0.6</text>
  <text x="80" y="132" class="title serif">一流入口：先接真实模型，再进入五声。</text>

  <g transform="translate(80 200)">
    <rect class="screen" width="580" height="680" rx="14"/>
    <text x="36" y="58" class="tiny sans">API SETUP</text>
    <text x="36" y="110" class="serif" style="fill:#191713;font-size:40px;font-weight:650;">先把 API 接上，<tspan x="36" dy="48">再让五声开口。</tspan></text>
    <text x="36" y="210" class="body sans">只接入真实模型。钥匙保存在本机或当前会话。</text>

    <g transform="translate(36 260)">
      <rect class="card" width="240" height="118" rx="8"/>
      <text x="20" y="34" class="h2 sans">DeepSeek</text>
      <text x="20" y="64" class="muted sans">默认推荐</text>
      <text x="20" y="94" class="mono muted">deepseek-chat</text>
      <rect x="188" y="18" width="34" height="22" rx="11" fill="#A8844D"/>
      <text x="196" y="34" class="tiny sans" fill="#FBF9F4">荐</text>
    </g>
    <g transform="translate(304 260)">
      <rect class="card" width="240" height="118" rx="8"/>
      <text x="20" y="34" class="h2 sans">阿里云百炼</text>
      <text x="20" y="64" class="muted sans">兼容接口</text>
      <text x="20" y="94" class="mono muted">qwen-plus</text>
    </g>
    <g transform="translate(36 400)">
      <rect class="card" width="156" height="86" rx="8"/>
      <text x="18" y="34" class="h2 sans">Kimi</text>
      <text x="18" y="62" class="mono muted">k2.6</text>
    </g>
    <g transform="translate(210 400)">
      <rect class="card" width="156" height="86" rx="8"/>
      <text x="18" y="34" class="h2 sans">MiniMax</text>
      <text x="18" y="62" class="mono muted">M2.7</text>
    </g>
    <g transform="translate(388 400)">
      <rect class="card" width="156" height="86" rx="8"/>
      <text x="18" y="34" class="h2 sans">豆包</text>
      <text x="18" y="62" class="mono muted">seed / ep</text>
    </g>

    <g transform="translate(36 535)">
      <rect class="deep" width="508" height="86" rx="8"/>
      <text x="24" y="34" class="tiny sans" fill="#B7AC9B">CONNECTION TEST</text>
      <text x="24" y="62" class="serif" style="fill:#FBF9F4;font-size:24px;">测试通过后，才保存为可用配置。</text>
    </g>
  </g>

  <g transform="translate(720 200)">
    <rect class="screen" width="640" height="680" rx="14"/>
    <text x="38" y="58" class="tiny sans">VOICE DIALOGUE</text>
    <text x="38" y="110" class="serif" style="fill:#191713;font-size:40px;font-weight:650;">点击某一声，主持会谈。</text>

    <g transform="translate(38 158)">
      <rect class="card" width="564" height="112" rx="8"/>
      <rect x="0" y="0" width="6" height="112" rx="3" fill="#8A6F3D"/>
      <text x="26" y="38" class="h2 sans">搞钱的我</text>
      <text x="26" y="70" class="body serif">我在保护现金流和选择权，我怕你把现实风险轻轻带过。</text>
    </g>

    <g transform="translate(38 304)">
      <rect class="card" width="172" height="76" rx="8"/>
      <text x="24" y="32" class="h2 sans">追问</text>
      <text x="24" y="58" class="muted sans">向这一声问一句</text>
    </g>
    <g transform="translate(234 304)">
      <rect class="card" width="172" height="76" rx="8"/>
      <text x="24" y="32" class="h2 sans">换位回答</text>
      <text x="24" y="58" class="muted sans">坐到它的位置</text>
    </g>
    <g transform="translate(430 304)">
      <rect class="card" width="172" height="76" rx="8"/>
      <text x="24" y="32" class="h2 sans">这句不准</text>
      <text x="24" y="58" class="muted sans">纠正表达</text>
    </g>

    <g transform="translate(38 426)">
      <rect class="deep" width="564" height="176" rx="8"/>
      <text x="28" y="42" class="tiny sans" fill="#B7AC9B">清明落定</text>
      <text x="28" y="86" class="serif" style="fill:#FBF9F4;font-size:32px;">我现在看清楚的是：</text>
      <text x="28" y="128" class="serif" style="fill:#FBF9F4;font-size:24px;">我不是不想结婚，我是不想用缩小自己来证明稳定。</text>
      <rect x="394" y="118" width="132" height="38" rx="6" fill="#8E3F32"/>
      <text x="418" y="143" class="sans" style="fill:#FBF9F4;font-size:15px;font-weight:620;">写下 24h 承诺</text>
    </g>
  </g>
</svg>
