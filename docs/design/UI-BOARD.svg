<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1040" viewBox="0 0 1440 1040" role="img" aria-labelledby="title desc">
  <title id="title">ParallelMe v0.6 Meeting UI Board</title>
  <desc id="desc">Primary meeting screen layout with stage rail, timeline, five voice cards, and host console.</desc>
  <defs>
    <style>
      .sans { font-family: Geist, "PingFang SC", "Noto Sans SC", sans-serif; }
      .serif { font-family: "Source Han Serif SC", "Noto Serif SC", "Songti SC", serif; }
      .mono { font-family: "Geist Mono", "SF Mono", monospace; }
      .title { fill: #191713; font-size: 42px; font-weight: 650; }
      .h2 { fill: #191713; font-size: 22px; font-weight: 620; }
      .body { fill: #3C3932; font-size: 17px; }
      .muted { fill: #7C7568; font-size: 15px; }
      .tiny { fill: #B7AC9B; font-size: 12px; letter-spacing: 0.12em; }
      .screen { fill: #F4F1EC; stroke: #D8CBB8; stroke-width: 2; }
      .card { fill: #FBF9F4; stroke: #D8CBB8; stroke-width: 1.5; }
      .sunk { fill: #EDE2D0; stroke: #D8CBB8; stroke-width: 1.5; }
      .line { stroke: #D8CBB8; stroke-width: 1.5; fill: none; }
    </style>
  </defs>

  <rect width="1440" height="1040" fill="#EDE2D0"/>
  <text x="80" y="78" class="tiny sans">PARALLELME · UI BOARD · V0.6</text>
  <text x="80" y="132" class="title serif">会谈页是工作台，不是聊天页。</text>

  <g transform="translate(170 180)">
    <rect class="screen" width="1100" height="780" rx="14"/>

    <g transform="translate(42 36)">
      <text x="0" y="0" class="muted sans">← 我的声音</text>
      <text x="888" y="0" class="muted sans">五声会谈</text>
      <g transform="translate(560 -16)">
        <circle cx="0" cy="14" r="7" fill="#455F70"/>
        <text x="22" y="20" class="h2 sans">困惑成形</text>
        <line x1="138" y1="14" x2="194" y2="14" class="line"/>
        <circle cx="210" cy="14" r="6" fill="#D8CBB8"/>
        <text x="230" y="20" class="muted sans">五声入席</text>
        <line x1="328" y1="14" x2="384" y2="14" class="line"/>
        <circle cx="400" cy="14" r="6" fill="#D8CBB8"/>
        <text x="420" y="20" class="muted sans">五声对话</text>
      </g>
    </g>

    <g transform="translate(42 105)">
      <rect class="card" width="1016" height="108" rx="8"/>
      <text x="30" y="42" class="muted sans">陈情</text>
      <text x="30" y="80" class="serif" style="fill:#191713;font-size:31px;">处了 3 年的对象想结婚了，但我一想到结婚就喘不过气。</text>
    </g>

    <g transform="translate(42 252)">
      <line x1="0" y1="0" x2="336" y2="0" class="line"/>
      <text x="360" y="6" class="serif muted" style="font-size:21px;">先把困惑放在桌面上，不急着回答。</text>
      <line x1="658" y1="0" x2="1016" y2="0" class="line"/>
    </g>

    <g transform="translate(42 294)">
      <rect class="card" width="1016" height="262" rx="8"/>
      <text x="32" y="46" class="muted sans">追问</text>
      <text x="32" y="88" class="h2 serif">你真正舍不得的是什么？</text>
      <rect x="32" y="112" width="952" height="76" rx="6" fill="#F4F1EC" stroke="#D8CBB8"/>
      <text x="52" y="158" class="muted sans">用户回答区域</text>
      <g transform="translate(32 210)">
        <rect width="190" height="34" rx="17" fill="#F4F1EC" stroke="#D8CBB8"/>
        <text x="18" y="23" class="muted sans">先放在这里</text>
        <rect x="210" width="190" height="34" rx="17" fill="#F4F1EC" stroke="#D8CBB8"/>
        <text x="228" y="23" class="muted sans">这题还不准</text>
      </g>
    </g>

    <g transform="translate(42 585)">
      <rect width="1016" height="92" rx="8" fill="#1A1816"/>
      <text x="30" y="34" class="tiny sans" fill="#B7AC9B">困惑成形 · 回答几个小问题</text>
      <text x="30" y="68" class="serif" style="fill:#FBF9F4;font-size:25px;">有一句话想先放在这里...</text>
      <rect x="820" y="20" width="166" height="52" rx="6" fill="#FBF9F4"/>
      <text x="852" y="54" class="sans" style="fill:#191713;font-size:18px;font-weight:620;">整理工作焦点 →</text>
    </g>

    <g transform="translate(42 710)">
      <text x="0" y="0" class="tiny sans">VOICE CARDS AFTER FOCUS</text>
      <g transform="translate(0 26)">
        <rect class="card" width="185" height="72" rx="8"/>
        <rect x="0" y="0" width="5" height="72" rx="2.5" fill="#556F7A"/>
        <text x="20" y="30" class="h2 sans">躺平的我</text>
        <text x="20" y="54" class="muted sans">保护身体</text>
      </g>
      <g transform="translate(208 26)">
        <rect class="card" width="185" height="72" rx="8"/>
        <rect x="0" y="0" width="5" height="72" rx="2.5" fill="#8A6F3D"/>
        <text x="20" y="30" class="h2 sans">搞钱的我</text>
        <text x="20" y="54" class="muted sans">保护资源</text>
      </g>
      <g transform="translate(416 26)">
        <rect class="card" width="185" height="72" rx="8"/>
        <rect x="0" y="0" width="5" height="72" rx="2.5" fill="#3F6B5A"/>
        <text x="20" y="30" class="h2 sans">出走的我</text>
        <text x="20" y="54" class="muted sans">保护出口</text>
      </g>
      <g transform="translate(624 26)">
        <rect class="card" width="185" height="72" rx="8"/>
        <rect x="0" y="0" width="5" height="72" rx="2.5" fill="#8C5042"/>
        <text x="20" y="30" class="h2 sans">讨妈欢心</text>
        <text x="20" y="54" class="muted sans">保护连接</text>
      </g>
      <g transform="translate(832 26)">
        <rect class="card" width="184" height="72" rx="8"/>
        <rect x="0" y="0" width="5" height="72" rx="2.5" fill="#5E5369"/>
        <text x="20" y="30" class="h2 sans">5 年后的我</text>
        <text x="20" y="54" class="muted sans">保护长线</text>
      </g>
    </g>
  </g>
</svg>
